name: "Vartheme Claro"
type: theme
base theme: claro
description: "A modern administration theme for Varbase standard websites. Based on the Claro Drupal core admin theme."
alt text: "Screenshot of Vartheme Claro, Varbase administration theme."
core_version_requirement: ~11.3.0
package: "Varbase"
regions:
  header: "Header"
  pre_content: "Pre-content"
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  help: Help
  content: Content
  page_top: "Page top"
  page_bottom: "Page bottom"
  sidebar_first: "First sidebar"
regions_hidden:
  - sidebar_first
libraries:
  - core/drupal.message
  - core/normalize
  - claro/global-styling
  - vartheme_claro/global-admin-styling
  - vartheme_claro/global-admin-scripts
libraries-override:
  claro/install-page:
    css:
      theme:
        css/theme/install-page.css: css/install-page.css

  core/drupal.tabledrag:
    css:
      component:
        misc/components/tabledrag.module.css: /core/themes/claro/css/components/tabledrag.css

  core/drupal.ajax:
    css:
      component:
        misc/components/ajax-progress.module.css: /core/themes/claro/css/components/ajax-progress.module.css

  core/drupal.autocomplete:
    css:
      component:
        misc/components/autocomplete-loading.module.css: /core/themes/claro/css/components/autocomplete-loading.module.css

  system/base:
    css:
      component:
        css/components/system-status-counter.css: /core/themes/claro/css/components/system-status-counter.css
        css/components/system-status-report-counters.css: /core/themes/claro/css/components/system-status-report-counters.css
        css/components/system-status-report-general-info.css: /core/themes/claro/css/components/system-status-report-general-info.css

  system/admin:
    css:
      theme:
        css/system.admin.css: false

  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: /core/themes/claro/css/components/dropbutton.css

  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false
    js:
      misc/vertical-tabs.js: /core/themes/claro/js/vertical-tabs.js

  core/internal.jquery_ui:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false

  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/base/dialog.css: false

  user/drupal.user:
    css:
      component:
        css/user.module.css: false

  field_ui/drupal.field_ui:
    css:
      theme:
        css/field_ui.admin.css: /core/themes/claro/css/theme/field-ui.admin.css

  node/drupal.node:
    css:
      layout:
        css/node.module.css: false

  node/form:
    css:
      layout:
        css/node.module.css: false

  toolbar/toolbar:
    css:
      component:
        css/toolbar.module.css: /core/themes/claro/css/components/toolbar.module.css
      theme:
        css/toolbar.theme.css: /core/themes/claro/css/theme/toolbar.theme.css
        css/toolbar.icons.theme.css: /core/themes/claro/css/theme/toolbar.icons.theme.css

  toolbar/toolbar.menu:
    css:
      state:
        css/toolbar.menu.css: /core/themes/claro/css/state/toolbar.menu.css

  views_ui/admin.styling:
    css:
      component:
        css/views_ui.admin.css: /core/themes/claro/css/components/views_ui.admin.css
      theme:
        css/views_ui.admin.theme.css: /core/themes/claro/css/theme/views_ui.admin.theme.css

libraries-extend:
  core/drupal.collapse:
    - claro/details-focus
  core/drupal.dialog:
    - claro/claro.drupal.dialog
  core/drupal.dropbutton:
    - claro/dropbutton
  core/drupal.checkbox:
    - claro/checkbox
  core/drupal.message:
    - claro/messages
  core/drupal.progress:
    - claro/progress
  core/drupal.tabbingmanager:
    - claro/tabbingmanager
  core/drupal.tabledrag:
    - claro/claro.tabledrag
  core/drupal.tableselect:
    - claro/tableselect
  core/drupal.vertical-tabs:
    - claro/vertical-tabs
  file/drupal.file:
    - claro/file
  filter/drupal.filter.admin:
    - claro/filter
  filter/drupal.filter:
    - claro/filter
  system/admin:
    - claro/system.admin
  core/drupal.autocomplete:
    - claro/autocomplete
  tour/tour-styling:
    - claro/tour-styling
  shortcut/drupal.shortcut:
    - claro/drupal.shortcut
  core/drupal.ajax:
    - claro/ajax
  user/drupal.user:
    - claro/form.password-confirm
  node/drupal.node.preview:
    - claro/drupal.node.preview
  views/views.module:
    - claro/views
    - claro/views_ui
  media/media_embed_ckeditor_theme:
    - claro/classy.media_embed_ckeditor_theme
  media_library/ui:
    - claro/media_library.ui
  media_library/view:
    - claro/media_library.theme
  media_library/widget:
    - claro/media_library.theme
  image/admin:
    - claro/image.admin

ckeditor_stylesheets: false
ckeditor5-stylesheets: false
